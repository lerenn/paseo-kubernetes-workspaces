name: Release
# Tag vX.Y.Z to publish the operator image, the workspace image and the Helm chart (OCI) to ghcr.io.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paseo-workspaces-operator:${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: images/workspace
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paseo-workspace:${{ steps.v.outputs.version }}
      - name: Package and push the chart
        run: |
          v='${{ steps.v.outputs.version }}'
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm package charts/paseo-workspaces --version "$v" --app-version "$v" -d out
          helm push "out/paseo-workspaces-$v.tgz" "oci://ghcr.io/${OWNER}/charts"
